<div class="container">
  <div class="container-content">
    <div class="container-text">
      <div class="logo-container">
        <img [src]="LogoImagePath" alt="Logo" />
      </div>
      <div class="text">
        Dream, discover, book with Chase Travel
      </div>
    </div>
 
    <div class="container-image">
      <img [src]="HeroImagePath" alt="Hero image">
    </div>
  </div>
 
  <div class="container-form">
    <form action="">
      <h1>Welcome To Chase Travel</h1>
      <div class="input-group">
        <label for="username">Username</label>
        <input type="text" name="username" id="username" [(ngModel)]="userName" required />
      </div>
      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" name="password" id="password" [(ngModel)]="password" required />
      </div>
 
      <button (click)="onLoginClick()">Login</button>
      <div *ngIf="error" class="error">
        {{error}}
      </div>
    </form>
  </div>
</div>
