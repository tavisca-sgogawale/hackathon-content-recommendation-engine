<form #promptForm="ngForm" (ngSubmit)="generatePrompt(promptForm.value)">
    <div class="panel panel-primary " >
        <div class="panel-heading">
            <h3 class="panel-title"> Enter Your Prompt </h3>
        </div>
        <div class="panel-body ">
            <div class="row vertical-align">
                <div class="col-xs-8">
                    <div class="panel-body">
                        <div class="form-group">
                            <textarea id="prompt" name="prompt" [(ngModel)]="prompt" type="text" class="form-control"></textarea>
                        </div>
                    </div>
                    <div class="panel-body">
                        <button type="submit" class="btn btn-primary">Let's Check</button>
                    </div>
                    <div class="panel-footer ">
                        <ul class="list-group">
                            <li *ngFor="let promt of promptList" class="list-group-item" (click)="SetText(promt)">{{promt}}</li>
                        </ul>
                    </div>
                </div>
                <div class="col-xs-4">
                    <div class="row">
                        <img src="../../assets/images/image.png" />
                    </div>
                </div>
            </div>
        </div>
    </div>
</form>
